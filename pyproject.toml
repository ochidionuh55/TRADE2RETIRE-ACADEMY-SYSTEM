[project]
name = "t2r-os"
version = "0.1.0"
description = "Trade2Retire Academy operating system — canonical record, Friday-report loop, CEO brief."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "ASYNC", "BLE", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
